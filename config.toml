# config.toml
# Inference configuration for e_infer.py.

[infer]

# Seed tokens to start generation (must appear in the training corpus).
# context_size=2: exactly two seed tokens required.
seed_0 = "a"
seed_1 = "model"

# Number of new tokens to generate after the start token.
num_tokens = 10

# Number of top predictions to display for the bootstrap context.
# "top-k" means the k tokens with the highest predicted probability.
# Higher values show more of the probability distribution.
topk = 5

# Must match the values used during training (set in c_model.py defaults).
embedding_dim = 16
head_dim = 16
context_size = 2
